name: ci

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.12.1"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: FFmpeg
        # The website, the cleaning step and the file check call ffmpeg and ffprobe; without them those tests
        # fail or skip. A static build from GitHub releases: Chocolatey's feed timed out on 11-18 and its
        # install still exited 0. The version check makes a failed install fail this step.
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          & "$bin/ffprobe.exe" -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install
        # `dashboard` is needed for the tests to actually run rather than skip.
        # The dashboard tests guard themselves with `importorskip("streamlit")`,
        # so without this extra they are silently skipped and the dashboard goes
        # untested in CI.
        run: uv sync --extra cpu --extra media --extra ml --extra tracking --extra dashboard --extra web --extra probe --group dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format
        run: uv run ruff format --check src tests scripts
      - name: Lock
        run: uv lock --check
      - name: Documentation
        run: uv run ddf-docs
      - name: Pull request change contract
        if: github.event_name == 'pull_request'
        run: uv run ddf-docs --changed-from ${{ github.event.pull_request.base.sha }}
      - name: Tests
        run: uv run pytest
      - name: Browser behavior
        run: node --test tests/test_webapp_behavior.js
      - name: Tracked smoke
        run: uv run --extra tracking ddf run --root . --config configs/local.yaml --config configs/smoke.yaml
  base-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install base package
        run: uv sync --locked --no-dev
      - name: Base CLI and documentation
        run: |
          uv run --no-sync ddf --help
          uv run --no-sync ddf split --help
          uv run --no-sync ddf-docs
