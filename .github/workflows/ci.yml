name: ci

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.12.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --extra cpu --extra media --extra ml --extra tracking --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lock
        run: uv lock --check
      - name: Documentation
        run: uv run ddf-docs
      - name: Pull request change contract
        if: github.event_name == 'pull_request'
        run: uv run ddf-docs --changed-from ${{ github.event.pull_request.base.sha }}
      - name: Tests
        run: uv run pytest
      - name: Detector evaluator fixture smoke
        run: uv run pytest tests/test_detector_cli.py -k detector_compare_fixture_smoke
      - name: Tracked smoke
        run: uv run --extra tracking ddf run --root . --config configs/local.yaml --config configs/smoke.yaml
