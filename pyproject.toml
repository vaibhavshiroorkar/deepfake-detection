[project]
name = "deepfake-detection"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "flask>=3.1.3",
    "psutil>=7.2.2",
    "soundfile>=0.14.0",
    "torch==2.14.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
