[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "deepfake-generalization"
version = "0.1.0"
description = "Shortcut-controlled multimodal deepfake detection research platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib==1.5.3",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "PyYAML==6.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.17.1; python_version < '3.12'",
    "scipy==1.18.1; python_version >= '3.12'",
]

[project.optional-dependencies]
media = [
    "av==16.1.0",
    "facenet-pytorch==2.5.3",
    "librosa==0.11.0",
    "opencv-python==5.0.0.93",
]
ml = [
    "timm==1.0.27",
    "transformers==5.13.0",
]
# Perception Encoder for the frozen-probe encoder comparison. Its own extra
# because it is needed only by `scripts/extract_probe_features.py --encoder pe`,
# and the handoff recorded for weeks that it could not be installed, which was
# the stated reason `A-encoder-comparison` stayed unmeasured. It installs fine.
probe = [
    "open-clip-torch==3.3.0",
]
dashboard = [
    "matplotlib==3.11.0",
    "streamlit==1.60.0",
]
tracking = [
    "mlflow==3.15.1",
]
# The user-facing web app. FastAPI and uvicorn already arrived through mlflow;
# declaring them here means the app does not depend on that accident.
web = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "pillow==12.2.0",
    "python-multipart==0.0.32",
    "uvicorn==0.52.4",
]
cpu = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]
cu130 = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "python-speech-features==0.6",
    "ruff==0.16.3",
]

[project.scripts]
ddf = "deepfake_detection.cli:main"
ddf-docs = "deepfake_detection.documentation.__main__:main"
ddf-web = "deepfake_detection.webapp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepfake_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["deepfake_detection"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
