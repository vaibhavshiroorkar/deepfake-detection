[project]
name = "deepfake-detection"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "torch==2.14.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
