<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deepfake Check Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css?v=2">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><rect x="7" y="9" width="18" height="14" rx="2" fill="none" stroke="var(--on-accent)" stroke-width="2.5"/><path d="M7 16h18" stroke="var(--on-accent)" stroke-width="2.5"/></svg>
    <span>Deepfake Check admin</span>
  </a>
  <a href="/">Back to the app</a>
</header>
<main class="admin">
  <div class="page">
    <header class="page-head">
      <h1>Settings for the user app</h1>
      <p>Choose which models users see, the default threshold, and how unfamiliar footage is handled. Changes apply to the next check, with no restart.</p>
    </header>
    <section class="panel" id="login">
      <form class="form" id="login-form">
        <label class="field"><span>Admin token</span><input type="password" id="token" autocomplete="current-password" required><small>The value of DDF_ADMIN_TOKEN on the server.</small></label>
        <div><button class="button primary" type="submit">Open settings</button></div>
        <p class="error" id="login-error" hidden></p>
      </form>
    </section>
    <section class="panel" id="editor" hidden>
      <form class="form" id="settings-form">
        <div class="field"><span>Models users can choose</span><div class="checks" id="enabled"></div></div>
        <label class="field"><span>Default model</span><select id="default_model"></select></label>
        <label class="field"><span>Default threshold</span><input type="number" id="default_threshold" min="0.001" max="0.999" step="0.001"><small>Probability at or above this is called manipulated.</small></label>
        <label class="toggle"><input type="checkbox" id="lock_threshold"><span><strong>Lock the threshold</strong>Users see the scale but cannot move it.</span></label>
        <label class="toggle"><input type="checkbox" id="withhold_unfamiliar"><span><strong>Hold back verdicts on unfamiliar footage by default</strong>Uses the DINOv3 familiarity check.</span></label>
        <label class="toggle"><input type="checkbox" id="allow_unfamiliar_override"><span><strong>Let users turn that off for one check</strong></span></label>
        <label class="toggle"><input type="checkbox" id="show_research_tabs"><span><strong>Show the research pages</strong>How it works, Results, Against prior work, Failures and limits, Report.</span></label>
        <label class="field"><span>Upload limit (MB)</span><input type="number" id="max_upload_mb" min="1" max="2048" step="1"></label>
        <div class="actions"><button class="button primary" type="submit">Save settings</button><span class="saved" id="saved" hidden>Saved</span></div>
        <p class="error" id="save-error" hidden></p>
        <div class="field"><span>Loaded engines</span><small id="engines"></small></div>
      </form>
    </section>
  </div>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
let token = "";
let models = [];

async function call(method, body) {
  const response = await fetch("/api/admin/settings", {
    method,
    headers: { "X-Admin-Token": token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || `The server answered ${response.status}`);
  return data;
}

function fill(data) {
  const s = data.settings;
  models = data.models || models;
  $("#enabled").innerHTML = models.map((m) => `<label class="toggle"><input type="checkbox" value="${m.id}" ${s.enabled_models.includes(m.id) ? "checked" : ""}><span><strong>${m.label}</strong></span></label>`).join("");
  $("#default_model").innerHTML = models.map((m) => `<option value="${m.id}" ${m.id === s.default_model ? "selected" : ""}>${m.label}</option>`).join("");
  $("#default_threshold").value = s.default_threshold;
  for (const key of ["lock_threshold", "withhold_unfamiliar", "allow_unfamiliar_override", "show_research_tabs"]) $(`#${key}`).checked = s[key];
  $("#max_upload_mb").value = s.max_upload_mb;
  const engines = Object.entries(data.engines || {});
  $("#engines").textContent = engines.length ? engines.map(([k, v]) => `${k}: ${v}`).join("; ") : "None yet. Each loads on its first check.";
}

$("#login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  token = $("#token").value;
  try {
    fill(await call("GET"));
    $("#login").hidden = true;
    $("#editor").hidden = false;
  } catch (error) {
    $("#login-error").hidden = false;
    $("#login-error").textContent = error.message;
  }
});

$("#settings-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("#saved").hidden = true;
  $("#save-error").hidden = true;
  const body = {
    enabled_models: [...document.querySelectorAll("#enabled input:checked")].map((i) => i.value),
    default_model: $("#default_model").value,
    default_threshold: Number($("#default_threshold").value),
    lock_threshold: $("#lock_threshold").checked,
    withhold_unfamiliar: $("#withhold_unfamiliar").checked,
    allow_unfamiliar_override: $("#allow_unfamiliar_override").checked,
    show_research_tabs: $("#show_research_tabs").checked,
    max_upload_mb: Number($("#max_upload_mb").value),
  };
  try {
    const saved = await call("PUT", body);
    fill({ ...saved, models });
    $("#saved").hidden = false;
  } catch (error) {
    $("#save-error").hidden = false;
    $("#save-error").textContent = error.message;
  }
});
</script>
</body>
</html>
